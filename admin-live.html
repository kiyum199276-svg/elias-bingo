<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELIAS BINGO Admin Live</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#101827;color:#fff}
#bar{position:sticky;top:0;z-index:10;background:#17263b;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 3px 12px #0005}
#bar strong{font-size:15px}input,button{font-size:15px;padding:10px;border-radius:8px;border:0}input{width:150px}button{background:#f4c542;color:#17243a;font-weight:bold}
#status{font-size:13px;color:#cbd5e1;flex:1;min-width:150px}iframe{display:block;width:100%;height:calc(100vh - 62px);border:0;background:#fff}
@media(max-width:520px){#bar{gap:6px}#bar strong{width:100%}input{flex:1;min-width:110px}#status{width:100%}iframe{height:calc(100vh - 106px)}}
</style></head><body>
<div id="bar"><strong>ELIAS BINGO LIVE ROOM</strong><input id="gameId" readonly aria-label="Game ID"><button id="newRoom">Create Game ID</button><button id="copy">Copy ID</button><button id="resetRound" type="button">Reset Game &amp; Release Cards</button><span id="status">Create a Game ID to connect players.</span></div>
<iframe id="adminFrame" src="ELIAS_BINGO_AUTO_PATTERN_NEW_GAME_FIXED.html" title="ELIAS BINGO Admin"></iframe>
<script>
"use strict";
const SERVER="wss://elias-bingo.elum199276kk.workers.dev/room/";
const input=document.getElementById("gameId"),status=document.getElementById("status");
let socket=null,token="",lastSent="",timer=null,adminFrameReady=false;
const savedId=localStorage.getItem("eliasBingoAdminRoomId");
const savedToken=localStorage.getItem("eliasBingoAdminRoomToken");
if(savedId&&savedToken){input.value=savedId;token=savedToken;connect();}
function createRoom(){
 const id="ELIAS-"+Math.random().toString(36).slice(2,8).toUpperCase();
 token=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).repeat(4))+Math.random().toString(36);
 input.value=id;localStorage.setItem("eliasBingoAdminRoomId",id);localStorage.setItem("eliasBingoAdminRoomToken",token);connect();
}
function connect(){
 if(!input.value||!token)return;
 if(socket)try{socket.close()}catch{}
 status.textContent="Connecting room "+input.value+"…";
 socket=new WebSocket(SERVER+encodeURIComponent(input.value));
 socket.addEventListener("open",()=>{socket.send(JSON.stringify({type:"ADMIN_AUTH",token}));status.textContent="Connected. Share Game ID: "+input.value;});
 socket.addEventListener("message",e=>{let m;try{m=JSON.parse(e.data)}catch{return}
  if(m.type==="ADMIN_AUTH_OK"){status.textContent="Admin connected • Game ID: "+input.value;sync();}
  if(m.type==="ROOM_STATE"&&m.data){renderDepositSettings(m.data);renderCardRequests(m.data);renderWithdrawals(m.data);}
  if(m.type==="DEPOSIT_CONFIG_SAVED"){status.textContent="Deposit settings saved.";}
  if(m.type==="PLAYER_PASSWORD_RESET"){const d=getAdminDoc();if(d&&d.getElementById("resetPlayerPasswordStatus"))d.getElementById("resetPlayerPasswordStatus").textContent="Temporary password set for "+m.phone+". Give it to the player privately; they must change it after login.";if(d&&d.getElementById("temporaryPlayerPassword"))d.getElementById("temporaryPlayerPassword").value="";status.textContent="Player password reset.";}
  if(m.type==="BINGO_CLAIM"){status.textContent="🏆 BINGO CLAIM • "+m.playerName+" • Card "+m.cardNumber;showClaimInAdminPage(m);}
  if(m.type==="ERROR")status.textContent="Server: "+m.message;
 });
 socket.addEventListener("close",()=>{status.textContent="Disconnected. Refresh or reconnect.";});
 socket.addEventListener("error",()=>{status.textContent="Connection error. Check Worker deployment.";});
}
const PATTERN_NAMES={"six":"6 Any Line","five":"5 Any Line","four":"4 Any Line","6lines":"6 Any Line","5lines":"5 Any Line","4lines":"4 Any Line","2v2h":"2 Up + 2 Row","3v3h":"3 Up + 3 Row","different":"4 Different Lines","blackout":"Fully Black / Blackout","fourcorners":"Four Corners","xpattern":"X Pattern","plus":"Plus / Cross","topbottom":"Top + Bottom","frame":"Outside Frame","innerbox":"Inner Box","postage":"Postage Stamp"};
function getAdminDoc(){try{return document.getElementById("adminFrame").contentDocument}catch(e){return null}}
function installPage2Panel(){
 const d=getAdminDoc(),page=d&&d.getElementById("page2");if(!page)return false;
 if(d.getElementById("remoteBingoClaims"))return true;
 const style=d.createElement("style");style.textContent="#remoteBingoClaims{background:#fff8df;color:#352b13;border:2px solid #d6a72b;border-radius:12px;padding:12px;margin:10px 0 16px;font-family:Arial,sans-serif}#remoteBingoClaims h2{margin:0 0 8px;font-size:18px;color:#543b00}#remoteBingoClaims .claim-meta{font-weight:bold;margin:5px 0}#remoteBingoClaims .claim-card{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;max-width:430px;margin:10px 0}#remoteBingoClaims .claim-cell{background:#e9edf5;color:#18233a;border:1px solid #9aa7bc;border-radius:5px;min-height:40px;display:grid;place-items:center;font-weight:800;font-size:14px}#remoteBingoClaims .claim-cell.hit{background:#36c58b;color:#063b27}#remoteBingoClaims .claim-cell.free{background:#f5d36a;color:#382700}#remoteBingoClaims .claim-head{background:#273957;color:#fff}#remoteBingoClaims .claim-note{font-size:13px;color:#4b5563}";
 d.head.appendChild(style);
 const panel=d.createElement("section");panel.id="remoteBingoClaims";panel.innerHTML="<h2>🎟 CARD PRICE</h2><div style='display:flex;gap:8px;align-items:center;flex-wrap:wrap'><input id='cardPrice' type='number' min='0.01' step='0.01' placeholder='Price per card (ETB)' style='width:180px;padding:9px;border:1px solid #aaa;border-radius:6px'><button id='saveCardPrice' type='button' style='background:#173b62;color:white;padding:9px 13px;border:0;border-radius:6px'>Save card price</button></div><div id='cardPriceStatus' class='claim-note'>Card price not set.</div><hr><h2>💳 DEPOSIT SETTINGS</h2><label style='display:block;margin:8px 0'><input id='depositEnabled' type='checkbox'> Require deposit for this game</label><div style='display:flex;gap:7px;flex-wrap:wrap'><input id='depositAmount' type='number' min='0.01' step='0.01' placeholder='Amount' style='width:110px;padding:9px;border:1px solid #aaa;border-radius:6px'><select id='depositCurrency' style='padding:9px;border:1px solid #aaa;border-radius:6px'><option>ETB</option></select><select id='depositMethod' style='padding:9px;border:1px solid #aaa;border-radius:6px'><option>Telebirr</option><option>CBE Birr</option><option>E-Birr</option></select><input id='depositAccount' placeholder='Payment account number' style='flex:1;min-width:150px;padding:9px;border:1px solid #aaa;border-radius:6px'></div><button id='saveDepositConfig' type='button' style='margin:8px 0;background:#173b62;color:white;padding:9px 13px;border:0;border-radius:6px'>Save deposit settings</button><div id='depositConfigStatus' class='claim-note'>Deposits are OFF.</div><h3>Pending deposit requests</h3><div id='remoteDepositRequests' class='claim-note'>No deposit requests.</div><hr><h2>🗂 PLAYER CARD REQUESTS</h2><div id='remoteCardRequests' class='claim-note'>No pending card requests.</div><hr><h2>🏆 LIVE PLAYER BINGO CLAIMS</h2><div id='remotePattern' class='claim-meta'>Winning pattern: waiting for game state</div><div id='remoteClaimBody' class='claim-note'>Player Bingo claims will appear here. The Admin must verify each claim.</div><hr><h2>💸 PLAYER WITHDRAWAL REQUESTS</h2><div id='remoteWithdrawals' class='claim-note'>No withdrawal requests.</div><hr><h2>🔐 RESET PLAYER PASSWORD</h2><div class='claim-note'>Find a registered player in this game by phone number and set a temporary password. The player must change it after logging in.</div><div style='display:flex;gap:7px;flex-wrap:wrap;margin-top:8px'><input id='resetPlayerPhone' inputmode='tel' placeholder='Player phone number' style='flex:1;min-width:150px;padding:9px;border:1px solid #aaa;border-radius:6px'><input id='temporaryPlayerPassword' type='text' placeholder='Temporary password (8+)' style='flex:1;min-width:150px;padding:9px;border:1px solid #aaa;border-radius:6px'><button id='resetPlayerPassword' type='button' style='background:#173b62;color:white;padding:9px 13px;border:0;border-radius:6px'>Reset password</button></div><div id='resetPlayerPasswordStatus' class='claim-note'>No password reset requested.</div>";
 page.insertBefore(panel,page.firstChild);
 const requests=d.getElementById("remoteCardRequests");
 requests.addEventListener("click",ev=>{const btn=ev.target.closest("button[data-card-action]");if(!btn||!socket||socket.readyState!==WebSocket.OPEN)return;socket.send(JSON.stringify({type:btn.dataset.cardAction,playerId:btn.dataset.playerId,cardNumber:Number(btn.dataset.cardNumber)}));btn.disabled=true;btn.textContent="Sending…";});
 const claims=d.getElementById("remoteClaimBody");
 claims.addEventListener("click",ev=>{const btn=ev.target.closest("button[data-confirm-claim]");if(!btn||!socket||socket.readyState!==WebSocket.OPEN)return;const amount=Number(d.getElementById("winnerPrizeAmount").value);if(!Number.isFinite(amount)||amount<=0){status.textContent="Enter a valid prize amount.";return;}socket.send(JSON.stringify({type:"ADMIN_CONFIRM_WINNER",claimId:btn.dataset.confirmClaim,amount,currency:"ETB"}));btn.disabled=true;btn.textContent="Confirming…";});
 const withdrawals=d.getElementById("remoteWithdrawals");
 withdrawals.addEventListener("click",ev=>{const btn=ev.target.closest("button[data-withdrawal-action]");if(!btn||!socket||socket.readyState!==WebSocket.OPEN)return;socket.send(JSON.stringify({type:btn.dataset.withdrawalAction,withdrawalId:btn.dataset.withdrawalId,decision:btn.dataset.decision}));btn.disabled=true;btn.textContent="Sending…";});
 const deposits=d.getElementById("remoteDepositRequests");
 deposits.addEventListener("click",ev=>{const btn=ev.target.closest("button[data-deposit-decision]");if(!btn||!socket||socket.readyState!==WebSocket.OPEN)return;socket.send(JSON.stringify({type:"ADMIN_REVIEW_DEPOSIT",depositId:btn.dataset.depositId,decision:btn.dataset.depositDecision}));btn.disabled=true;btn.textContent="Sending…";});
 d.getElementById("resetPlayerPassword").addEventListener("click",()=>{
  if(!socket||socket.readyState!==WebSocket.OPEN){status.textContent="Connect Admin first.";return;}
  const phone=d.getElementById("resetPlayerPhone").value.trim(),temporaryPassword=d.getElementById("temporaryPlayerPassword").value;
  if(!phone||temporaryPassword.length<8){d.getElementById("resetPlayerPasswordStatus").textContent="Enter the player's phone number and a temporary password of at least 8 characters.";return;}
  socket.send(JSON.stringify({type:"ADMIN_RESET_PLAYER_PASSWORD",phone,temporaryPassword}));
  d.getElementById("resetPlayerPasswordStatus").textContent="Sending password reset request…";
 });
 d.getElementById("saveCardPrice").addEventListener("click",()=>{if(!socket||socket.readyState!==WebSocket.OPEN){status.textContent="Connect Admin first.";return;}const price=Number(d.getElementById("cardPrice").value);if(!Number.isFinite(price)||price<=0){status.textContent="Enter a valid price per card.";return;}socket.send(JSON.stringify({type:"ADMIN_SET_CARD_PRICE",price}));d.getElementById("cardPriceStatus").textContent="Saving card price…";});
 d.getElementById("saveDepositConfig").addEventListener("click",()=>{if(!socket||socket.readyState!==WebSocket.OPEN){status.textContent="Connect Admin first.";return;}socket.send(JSON.stringify({type:"ADMIN_SET_DEPOSIT_CONFIG",enabled:d.getElementById("depositEnabled").checked,amount:Number(d.getElementById("depositAmount").value),currency:d.getElementById("depositCurrency").value,method:d.getElementById("depositMethod").value,account:d.getElementById("depositAccount").value}));d.getElementById("depositConfigStatus").textContent="Saving deposit settings…";});
 return true;
}
function renderDepositSettings(room){
 if(!installPage2Panel())return;
 const d=getAdminDoc(),cfg=room.depositConfig||{enabled:false,amount:0,currency:"ETB",method:"Telebirr",account:""};
 const priceEl=d.getElementById("cardPrice");if(priceEl&&d.activeElement!==priceEl)priceEl.value=room.cardPrice||"";const priceStatus=d.getElementById("cardPriceStatus");if(priceStatus)priceStatus.textContent=Number(room.cardPrice)>0?"Card price: "+room.cardPrice+" ETB per card":"Card price not set.";
 const enabled=d.getElementById("depositEnabled");
 if(d.activeElement!==enabled)enabled.checked=!!cfg.enabled;
 for(const [id,value] of [["depositAmount",cfg.amount||""],["depositCurrency",cfg.currency||"ETB"],["depositMethod",cfg.method||"Telebirr"],["depositAccount",cfg.account||""]]){
  const el=d.getElementById(id);if(d.activeElement!==el)el.value=value;
 }
 d.getElementById("depositConfigStatus").textContent=cfg.enabled?"ON • "+cfg.amount+" "+cfg.currency+" • "+cfg.method+" • Account: "+cfg.account:"Deposits are OFF. Players can join without deposit approval.";
 const root=d.getElementById("remoteDepositRequests");root.innerHTML="";
 const deposits=room.deposits||{};let count=0;
 Object.values(deposits).forEach(dep=>{
  if(!dep||dep.status!=="pending")return;count++;
  const row=d.createElement("div");row.style.cssText="border:1px solid #d7dce5;border-radius:8px;padding:8px;margin:6px 0";
  const label=d.createElement("div");label.textContent=(dep.playerName||"Player")+" • "+dep.amount+" "+dep.currency+" • "+dep.method+" • Ref: "+dep.reference;row.appendChild(label);
  ["approved","rejected"].forEach(decision=>{const btn=d.createElement("button");btn.type="button";btn.textContent=decision==="approved"?"Approve payment":"Reject";btn.dataset.depositDecision=decision;btn.dataset.depositId=dep.id;btn.style.cssText="margin:7px 6px 0 0;padding:8px 10px;border:0;border-radius:6px;background:"+(decision==="approved"?"#16865d":"#b42318")+";color:white;font-weight:bold";row.appendChild(btn);});
  root.appendChild(row);
 });
 if(!count)root.textContent="No pending deposit requests.";
}
function renderCardRequests(room){
 if(!installPage2Panel())return;
 const d=getAdminDoc(),root=d.getElementById("remoteCardRequests");if(!root)return;
 root.innerHTML="";
 const players=room&&room.players?room.players:{};
 let count=0;
 Object.keys(players).forEach(playerId=>{
  const player=players[playerId]||{},pending=Array.isArray(player.pendingCards)?player.pendingCards:[];
  pending.forEach(cardNumber=>{
   count++;
   const row=d.createElement("div");row.style.cssText="display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid #d7dce5;border-radius:8px;padding:8px;margin:6px 0";
   const label=d.createElement("strong");label.textContent=(player.name||"Player")+" • Card "+cardNumber;row.appendChild(label);
   ["ADMIN_APPROVE_CARD","ADMIN_REJECT_CARD"].forEach(action=>{
    const btn=d.createElement("button");btn.type="button";btn.textContent=action==="ADMIN_APPROVE_CARD"?"Approve":"Reject";btn.style.cssText=action==="ADMIN_APPROVE_CARD"?"background:#16865d;color:white;padding:8px 12px;border:0;border-radius:6px;font-weight:bold":"background:#b42318;color:white;padding:8px 12px;border:0;border-radius:6px;font-weight:bold";
    btn.dataset.cardAction=action;btn.dataset.playerId=playerId;btn.dataset.cardNumber=String(cardNumber);row.appendChild(btn);
   });
   root.appendChild(row);
  });
 });
 if(!count)root.textContent="No pending card requests.";
}
function renderWithdrawals(room){
 if(!installPage2Panel())return;
 const d=getAdminDoc(),root=d.getElementById("remoteWithdrawals");if(!root)return;
 root.innerHTML="";
 const items=Object.values(room.withdrawals||{}).sort((x,y)=>(y.createdAt||0)-(x.createdAt||0));
 if(!items.length){root.textContent="No withdrawal requests.";return;}
 items.forEach(item=>{
  const row=d.createElement("div");row.style.cssText="border:1px solid #d7dce5;border-radius:8px;padding:8px;margin:6px 0";
  const label=d.createElement("div");label.textContent=(item.playerName||"Player")+" • "+item.amount+" "+(item.currency||"ETB")+" • "+item.method+" • Account: "+item.account+" • "+item.status.toUpperCase();row.appendChild(label);
  const add=(text,action,decision)=>{const b=d.createElement("button");b.type="button";b.textContent=text;b.dataset.withdrawalAction=action;b.dataset.withdrawalId=item.id;if(decision)b.dataset.decision=decision;b.style.cssText="margin:7px 6px 0 0;padding:8px 10px;border:0;border-radius:6px;background:#173b62;color:white;font-weight:bold";row.appendChild(b);};
  if(item.status==="pending"){add("Approve","ADMIN_REVIEW_WITHDRAWAL","approved");add("Reject","ADMIN_REVIEW_WITHDRAWAL","rejected");}
  if(item.status==="approved")add("Mark paid","ADMIN_MARK_WITHDRAWAL_PAID","");
  root.appendChild(row);
 });
}
function showClaimInAdminPage(m){
 if(!installPage2Panel())return;
 const d=getAdminDoc(),body=d.getElementById("remoteClaimBody"),pattern=d.getElementById("remotePattern");
 pattern.textContent="Winning pattern: "+(m.patternName||PATTERN_NAMES[m.pattern]||m.pattern||"Not set");
 body.innerHTML="";
 const title=d.createElement("div");title.className="claim-meta";title.textContent="🏆 "+m.playerName+" • Card "+m.cardNumber+" • Pending verification";body.appendChild(title);
 if(Array.isArray(m.cardValues)&&m.cardValues.length===25){
  const grid=d.createElement("div");grid.className="claim-card";
  ["B","I","N","G","O"].forEach(x=>{const c=d.createElement("div");c.className="claim-cell claim-head";c.textContent=x;grid.appendChild(c)});
  m.cardValues.forEach(v=>{const c=d.createElement("div");c.className="claim-cell"+(v==="FREE"?" free":((m.calledNumbers||[]).includes(Number(v))?" hit":""));c.textContent=String(v);grid.appendChild(c)});
  body.appendChild(grid);
 }else{const note=d.createElement("div");note.textContent="Card layout was not included in this claim.";body.appendChild(note);}
 const note=d.createElement("div");note.className="claim-note";note.textContent="Check the called numbers and winning pattern before confirming the winner. Confirm only after manual verification.";body.appendChild(note);
 if(m.claimId){const label=d.createElement("label");label.textContent="Prize amount (ETB): ";const amount=d.createElement("input");amount.id="winnerPrizeAmount";amount.type="number";amount.min="0.01";amount.step="0.01";amount.placeholder="Prize amount";amount.style.cssText="width:130px;padding:8px;border:1px solid #aaa;border-radius:6px";label.appendChild(amount);body.appendChild(label);const confirm=d.createElement("button");confirm.type="button";confirm.textContent="Confirm winner & add prize";confirm.dataset.confirmClaim=m.claimId;confirm.style.cssText="display:block;margin-top:8px;padding:9px 12px;background:#16865d;color:white;border:0;border-radius:6px;font-weight:bold";body.appendChild(confirm);}
}
document.getElementById("adminFrame").addEventListener("load",()=>{adminFrameReady=true;installPage2Panel();sync();});
function sync(){
 if(!socket||socket.readyState!==WebSocket.OPEN)return;
 try{
  const raw=localStorage.getItem("eliasBingoAdminV3");
  if(!raw)return;
  const state=JSON.parse(raw),nums=Array.isArray(state.called)?state.called:[];
  const patternName=PATTERN_NAMES[state.pattern]||state.pattern||"Not selected";
  const payload=JSON.stringify({calledNumbers:nums,pattern:state.pattern||"",patternName,patternMode:state.patternMode||"auto"});
  if(payload===lastSent)return;
  lastSent=payload;
  socket.send(JSON.stringify({type:"ADMIN_SYNC_STATE",calledNumbers:nums,pattern:state.pattern||"",patternName,patternMode:state.patternMode||"auto"}));
  if(adminFrameReady){installPage2Panel();const d=getAdminDoc(),el=d&&d.getElementById("remotePattern");if(el)el.textContent="Winning pattern: "+patternName+" ("+(state.patternMode==="manual"?"Admin selected":"Auto")+")";}
  status.textContent="Live • "+input.value+" • "+nums.length+" numbers called";
 }catch(e){status.textContent="Could not read Admin game state."}
}
document.getElementById("resetRound").addEventListener("click",()=>{
 if(!socket||socket.readyState!==WebSocket.OPEN){status.textContent="Connect Admin first.";return;}
 if(!confirm("Reset this game round? All cards will become available to every player. Wallets and transaction history will stay safe."))return;
 try{
  const raw=localStorage.getItem("eliasBingoAdminV3");
  if(raw){const state=JSON.parse(raw);state.called=[];localStorage.setItem("eliasBingoAdminV3",JSON.stringify(state));}
 }catch(e){status.textContent="Could not reset Admin game state.";return;}
 lastSent="";
 socket.send(JSON.stringify({type:"ADMIN_START_NEW_ROUND"}));
 status.textContent="Resetting game and releasing all cards…";
 setTimeout(()=>{const frame=document.getElementById("adminFrame");frame.src=frame.src;},250);
});
document.getElementById("newRoom").addEventListener("click",createRoom);
document.getElementById("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(input.value);status.textContent="Game ID copied: "+input.value}catch{status.textContent="Game ID: "+input.value}});
setInterval(sync,700);
window.addEventListener("storage",sync);
</script></body></html>
