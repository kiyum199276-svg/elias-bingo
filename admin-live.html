const ADMIN_SESSION_KEY="eliasBingoAdminAccountSession";
function clearAdminAccountSession(){localStorage.removeItem(ADMIN_SESSION_KEY);}
function restoreAdminAccountSession(){
 try{
  const saved=JSON.parse(localStorage.getItem(ADMIN_SESSION_KEY)||"null");
  if(!saved||!saved.token||!saved.gameId||!saved.expiresAt||Date.now()>=saved.expiresAt){clearAdminAccountSession();return false;}
  token=saved.token;input.value=saved.gameId;
  document.getElementById("newRoom").disabled=true;
  document.getElementById("newRoom").textContent="Owner-assigned Game ID";
  status.textContent="Restoring Admin session for "+saved.gameId+"…";
  connect();return true;
 }catch{clearAdminAccountSession();return false;}
}
async function loginAdminAccount(){
 const phone=document.getElementById("adminPhone").value.trim();
 const password=document.getElementById("adminPassword").value;
 if(!phone||!password){status.textContent="Enter your Admin phone number and password.";return;}
 const button=document.getElementById("adminLogin");button.disabled=true;status.textContent="Signing in…";
 try{
  const response=await fetch(API+"/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone,password})});
  const data=await response.json().catch(()=>({error:"Invalid server response."}));
  if(!response.ok)throw new Error(data.error||"Admin login failed.");
  // If this Admin account belongs to a different game, clear only the stale
  // browser room credentials and old called-number cache; keep server records intact.
  if(savedId && savedId!==data.gameId){
   localStorage.removeItem("eliasBingoAdminRoomId");
   localStorage.removeItem("eliasBingoAdminRoomToken");
   try{const raw=localStorage.getItem("eliasBingoAdminV3");if(raw){const state=JSON.parse(raw);state.called=[];localStorage.setItem("eliasBingoAdminV3",JSON.stringify(state));}}catch{}
  }
  token=data.token;input.value=data.gameId;
  localStorage.setItem(ADMIN_SESSION_KEY,JSON.stringify({token:data.token,gameId:data.gameId,expiresAt:Date.now()+Number(data.expiresIn||28800)*1000}));
  document.getElementById("adminPassword").value="";
  document.getElementById("newRoom").disabled=true;
  document.getElementById("newRoom").textContent="Owner-assigned Game ID";
  connect();
 }catch(error){status.textContent=error.message;}
 finally{button.disabled=false;}
}

function connect(){
 if(!input.value||!token)return;
 if(heartbeat){clearInterval(heartbeat);heartbeat=null;}
 if(socket)try{socket.close()}catch{}
 status.textContent="Connecting room "+input.value+"…";
 socket=new WebSocket(SERVER+encodeURIComponent(input.value));
 socket.addEventListener("open",()=>{socket.send(JSON.stringify({type:"ADMIN_AUTH",token}));heartbeat=setInterval(()=>{if(socket&&socket.readyState===WebSocket.OPEN)try{socket.send(JSON.stringify({type:"PING"}));}catch{}},15000);status.textContent="Connected. Share Game ID: "+input.value;});
 socket.addEventListener("message",e=>{let m;try{m=JSON.parse(e.data)}catch{return}
  if(m.type==="ADMIN_AUTH_OK"){document.getElementById("adminFrame").style.display="block";status.textContent="Admin connected • Game ID: "+input.value;sync();}
  if(m.type==="ROOM_STATE"&&m.data){
    latestRoomState=m.data;
    const roundKey="eliasBingoAdminRound:"+input.value,previousRound=localStorage.getItem(roundKey),incomingRound=String(Number(m.data.gameRound)||0);
    if(previousRound!==null&&previousRound!==incomingRound){
     try{const raw=localStorage.getItem("eliasBingoAdminV3");if(raw){const state=JSON.parse(raw);state.called=[];localStorage.setItem("eliasBingoAdminV3",JSON.stringify(state));}}catch{}
     lastSent="";
    }
    localStorage.setItem(roundKey,incomingRound);
    renderPlayers(m.data);renderDepositSettings(m.data);renderCardRequests(m.data);renderCardGrid(m.data);renderWithdrawals(m.data);renderWinnerClaims(m.data);
   }
  if(m.type==="CARD_PRICE_SAVED"){status.textContent="Card price saved: "+Number(m.price).toFixed(2)+" ETB per card.";}
  if(m.type==="BINGO_CLAIM_REVIEWED"){status.textContent="Bingo claim marked "+String(m.verdict||"reviewed")+".";reviewedClaimIds.delete(String(m.claimId||""));}
  if(m.type==="DEPOSIT_CONFIG_SAVED"){status.textContent="Deposit settings saved.";}
  if(m.type==="ADMIN_CARD_ASSIGNED"){const d=getAdminDoc();if(d&&d.getElementById("assignCardStatus"))d.getElementById("assignCardStatus").textContent="Card "+m.cardNumber+" assigned successfully.";status.textContent="Card assigned.";}
  if(m.type==="PLAYER_PASSWORD_RESET"){const d=getAdminDoc();if(d&&d.getElementById("resetPlayerPasswordStatus"))d.getElementById("resetPlayerPasswordStatus").textContent="Temporary password set for "+m.phone+". Give it to the player privately; they must change it after login.";if(d&&d.getElementById("temporaryPlayerPassword"))d.getElementById("temporaryPlayerPassword").value="";status.textContent="Player password reset.";}
  if(m.type==="BINGO_CLAIM"){
    status.textContent="🏆 BINGO CLAIM • "+m.playerName+" • Card "+m.cardNumber+" • Check all winners for this call.";
    if(latestRoomState){if(!latestRoomState.claims)latestRoomState.claims={};latestRoomState.claims[m.claimId]={claimId:m.claimId,playerId:m.playerId,playerName:m.playerName,cardNumber:m.cardNumber,cardValues:m.cardValues,calledNumbers:m.calledNumbers||[],pattern:m.pattern||"",patternName:m.patternName||"",gameRound:Number(m.gameRound)||0,status:"pending",claimedAt:m.claimedAt||Date.now()};renderWinnerClaims(latestRoomState);}
   }
  if(m.type==="ROUND_WINNERS_SETTLED")status.textContent="🏆 "+m.winnerCount+" winner(s) paid "+Number(m.prizePool).toFixed(2)+" ETB total; each received "+Number(m.sharePerWinner).toFixed(2)+" ETB. New round started.";
   if(m.type==="ERROR"){
    status.textContent="Server: "+m.message;
    if(/disabled|password was reset|invalid admin|admin key rejected|session expired/i.test(m.message||""))clearAdminAccountSession();
   }
 });
 socket.addEventListener("close",()=>{if(heartbeat){clearInterval(heartbeat);heartbeat=null;}status.textContent="Disconnected. Refresh or reconnect.";});
 socket.addEventListener("error",()=>{status.textContent="Connection error. Check Worker deployment.";});
}

poraryPlayerPassword' type='text' placeholder='Temporary password (8+)' style='flex:1;min-width:150px;padding:9px;border:1px solid #aaa;border-radius:6px'><button id='resetPlayerPassword' type='button' style='background:#173b62;color:white;padding:9px 13px;border:0;border-radius:6px'>Reset password</button></div><div id='resetPlayerPasswordStatus' class='claim-note'>No password reset requested.</div>`;
 page.insertBefore(panel,page.firstChild);
 const cardGrid=d.getElementById("cardNumberGrid");
 if(cardGrid)cardGrid.addEventListener("click",ev=>{

 withdrawals.addEventListener("click",ev=>{const btn=ev.target.closest("button[data-withdrawal-action]");if(!btn||!socket||socket.readyState!==WebSocket.OPEN)return;socket.send(JSON.stringify({type:btn.dataset.withdrawalAction,withdrawalId:btn.dataset.withdrawalId,decision:btn.dataset.decision}));btn.disabled=true;btn.textContent="Sending…";});

 d.getElementById("saveDepositConfig").addEventListener("click",()=>{if(!socket||socket.readyState!==WebSocket.OPEN){status.textContent="Connect Admin first.";return;}socket.send(JSON.stringify({type:"ADMIN_SET_DEPOSIT_CONFIG",enabled:d.getElementById("depositEnabled").checked,amount:Number(d.getElementById("depositAmount").value),currency:d.getElementById("depositCurrency").value,method:d.getElementById("depositMethod").value,account:d.getElementById("depositAccount").value}));d.getElementById("depositConfigStatus").textContent="Saving deposit settings…";});

function renderPlayers(room){
 if(!installPage2Panel())return;
 const doc=getAdminDoc(),root=doc&&doc.getElementById("registeredPlayersList");
 if(!root)return;
 root.innerHTML="";
 const players=Object.values(room&&room.players||{}).sort((x,y)=>(x.joinedAt||0)-(y.joinedAt||0));

 if(picker){
  const selected=picker.value;picker.innerHTML="<option value=\"\">Choose player</option>";

function bindPage1CardPrice(doc){
 const d=doc||getAdminDoc(),input=d&&d.getElementById("ticketPrice");
 if(!input||input.dataset.serverPriceBound==="1")return;

 input.addEventListener("change",()=>{
  const price=Number(input.value);
  if(!Number.isFinite(price)||price<=0){status.textContent="Enter a valid price per card.";return;}
  try{if(typeof d.defaultView.calcMoney==="function")d.defaultView.calcMoney(false);}catch{}
  sendPage1CardPrice(price);
 });
}
function sendPage1CardPrice(price){
 if(!socket||socket.readyState!==WebSocket.OPEN){status.textContent="Connect Admin first to save the card price.";return;}
 const value=Number(price);
 if(!Number.isFinite(value)||value<=0){status.textContent="Enter a valid price per card.";return;}
 socket.send(JSON.stringify({type:"ADMIN_SET_CARD_PRICE",price:value}));
 status.textContent="Saving card price from Page 1…";
}
function syncPage1CardPrice(room){
 const d=getAdminDoc(),input=d&&d.getElementById("ticketPrice");
 if(!input)return;
 bindPage1CardPrice(d);
 const serverPrice=Number(room&&room.cardPrice)||0;
 if(serverPrice>0){
  page1CardPriceInitialized=true;
  if(d.activeElement!==input){
   input.value=String(serverPrice);
   try{if(typeof d.defaultView.calcMoney==="function")d.defaultView.calcMoney(false);}catch{}
  }
 }else if(!page1CardPriceInitialized&&socket&&socket.readyState===WebSocket.OPEN){
  const initialPrice=Number(input.value);

   page1CardPriceInitialized=true;
   sendPage1CardPrice(initialPrice);
  }
 }
}

  const input=label.querySelector('input[type="checkbox"]'),cell=label.querySelector("span");
  if(!input||!cell)return;

   cell.title=(player.name||"Player")+" • Pending Admin approval • Tap the red number to approve";

   label.classList.add("approved");cell.classList.add("approved");
   cell.title=(player.name||"Player")+" • Registered";

   cell.title="Available";

 });

 const players=room&&room.players?room.players:{};
 let count=0;
 Object.keys(players).forEach(playerId=>{
  const player=players[playerId]||{},pending=Array.isArray(player.pendingCards)?player.pendingCards:[];
  pending.forEach(cardNumber=>{
   count++;
   const row=d.createElement("div");row.style.cssText="display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid #d7dce5;border-radius:8px;padding:8px;margin:6px 0";
   const owner=(room.cards||{})[String(cardNumber)]||{},price=Number(owner.pricePerCard)||Number(room.cardPrice)||0;
   const label=d.createElement("strong");label.textContent=(player.name||"Player")+" • Card "+cardNumber+" • CASH "+price.toFixed(2)+" ETB (confirm cash received)";row.appendChild(label);
   ["ADMIN_APPROVE_CARD","ADMIN_REJECT_CARD"].forEach(action=>{
    const btn=d.createElement("button");btn.type="button";btn.textContent=action==="ADMIN_APPROVE_CARD"?"Approve":"Reject";btn.style.cssText=action==="ADMIN_APPROVE_CARD"?"background:#16865d;color:white;padding:8px 12px;border:0;border-radius:6px;font-weight:bold":"background:#b42318;color:white;padding:8px 12px;border:0;border-radius:6px;font-weight:bold";
    btn.dataset.cardAction=action;btn.dataset.playerId=playerId;btn.dataset.cardNumber=String(cardNumber);row.appendChild(btn);
   });
   root.appendChild(row);
  });
 });
 if(!count)root.textContent="No pending card requests.";
}
function renderWithdrawals(room){
 if(!installPage2Panel())return;
 const d=getAdminDoc(),root=d.getElementById("remoteWithdrawals");if(!root)return;
 root.innerHTML="";
 const items=Object.values(room.withdrawals||{}).sort((x,y)=>(y.createdAt||0)-(x.createdAt||0));
 if(!items.length){root.textContent="No withdrawal requests.";return;}
 items.forEach(item=>{
  const row=d.createElement("div");row.style.cssText="border:1px solid #d7dce5;border-radius:8px;padding:8px;margin:6px 0";
  const label=d.createElement("div");label.textContent=(item.playerName||"Player")+" • "+item.amount+" "+(item.currency||"ETB")+" • "+item.method+" • Account: "+item.account+" • "+item.status.toUpperCase();row.appendChild(label);
  const add=(text,action,decision)=>{const b=d.createElement("button");b.type="button";b.textContent=text;b.dataset.withdrawalAction=action;b.dataset.withdrawalId=item.id;if(decision)b.dataset.decision=decision;b.style.cssText="margin:7px 6px 0 0;padding:8px 10px;border:0;border-radius:6px;background:#173b62;color:white;font-weight:bold";row.appendChild(b);};
  if(item.status==="pending"){add("Approve","ADMIN_REVIEW_WITHDRAWAL","approved");add("Reject","ADMIN_REVIEW_WITHDRAWAL","rejected");}
  if(item.status==="approved")add("Mark paid","ADMIN_MARK_WITHDRAWAL_PAID","");
  root.appendChild(row);
 });
}
function classifyPlayerClaim(claim,doc){
 const values=Array.isArray(claim.cardValues)?claim.cardValues:null;
 const called=Array.isArray(claim.calledNumbers)?claim.calledNumbers.map(Number):[];
 if(!values||values.length!==25)return "rejected";
 let complete=false;
 try{
  const expression="(()=>{const oldCalled=s.called,oldPattern=s.pattern;try{s.called="+JSON.stringify(called)+";s.pattern="+JSON.stringify(String(claim.pattern||""))+";return !!qualifies("+JSON.stringify(values)+");}finally{s.called=oldCalled;s.pattern=oldPattern;}})()";
  complete=doc.defaultView.eval(expression)===true;
 }catch(error){console.warn("Could not verify player Bingo claim",error);}
 if(!complete)return "rejected";
 const latest=called.length?called[called.length-1]:undefined;
 if(latest!==undefined&&!values.some(value=>value!=="FREE"&&Number(value)===latest))return "passed";
 return "winner";
}
function playPlayerClaimSoundOnce(claim,verdict,win){
 const claimId=String(claim.claimId||"");
 if(!claimId||playedClaimSoundIds.has(claimId))return;
 const key="eliasBingoClaimSound:"+String(input.value||"")+":"+claimId;
 try{if(localStorage.getItem(key))return;localStorage.setItem(key,verdict);}catch{}
 playedClaimSoundIds.add(claimId);
 try{
  if(verdict==="winner"&&typeof win.announceGoodBingo==="function")win.announceGoodBingo(Number(claim.cardNumber));
  else if(verdict==="rejected"&&typeof win.playCardStatusVoice==="function")win.playCardStatusVoice("rejected");
  else if(verdict==="passed"&&typeof win.playCardStatusVoice==="function")win.playCardStatusVoice("missed");
 }catch(error){console.warn("Player Bingo claim sound failed",error);}
}
function renderWinnerClaims(room){
 if(!installPage2Panel())return;
 const d=getAdminDoc(),win=d&&d.defaultView,panel=d&&d.getElementById("publicWinnerDisplay");
 const body=d&&d.getElementById("publicWinnerContent"),heading=panel&&panel.querySelector("h2");
 if(!body||!panel||!win)return;
 const round=Number(room&&room.gameRound)||0;
 const claims=Object.values(room&&room.claims||{}).filter(claim=>
  claim&&Number(claim.gameRound||0)===round&&["pending","rejected","passed"].includes(String(claim.status||"").toLowerCase())
 ).sort((x,y)=>(Number(x.claimedAt)||0)-(Number(y.claimedAt)||0));
 if(!claims.length){
  win.__eliasPlayerClaimActive=false;
  if(heading)heading.textContent="🏆 የተረጋገጠ አሸናፊ — ለሁሉም ተጫዋቾች";
  if(typeof win.renderPublicWinner==="function")win.renderPublicWinner();
  return;
 }
 win.__eliasPlayerClaimActive=true;
 panel.style.display="block";
 if(heading)heading.textContent="👥 PLAYER LIVE BINGO CLAIM";
 body.innerHTML="";
 const rendered=[];
 claims.forEach(claim=>{
  let verdict=String(claim.status||"pending").toLowerCase();
  if(verdict==="pending"){
   verdict=classifyPlayerClaim(claim,d);
   playPlayerClaimSoundOnce(claim,verdict,win);
   if(verdict!=="winner"&&socket&&socket.readyState===WebSocket.OPEN&&!reviewedClaimIds.has(String(claim.claimId))){
    reviewedClaimIds.add(String(claim.claimId));
    socket.send(JSON.stringify({type:"ADMIN_REVIEW_BINGO_CLAIM",claimId:claim.claimId,verdict}));
   }
  }
  rendered.push({claim,verdict});
 });
 rendered.forEach(({claim,verdict})=>{
  const cardSection=d.createElement("section");
  cardSection.style.cssText="border:1px solid #d6a72b;border-radius:10px;padding:10px;margin:10px 0;background:#fff";
  const label=d.createElement("div");label.className="claim-meta";
  const statusText=verdict==="winner"?"🏆 VALID BINGO — awaiting Admin confirmation":verdict==="passed"?"⏰ PASSED BINGO — winning number was already passed":"✕ REJECTED — winning pattern is incomplete";
  label.textContent=(claim.playerName||"Player")+" • Card "+claim.cardNumber+" • "+statusText;
  cardSection.appendChild(label);
  const pattern=d.createElement("div");pattern.className="claim-note";
  pattern.textContent="Pattern: "+(claim.patternName||PATTERN_NAMES[claim.pattern]||claim.pattern||"Not set")+" • Called numbers: "+(Array.isArray(claim.calledNumbers)?claim.calledNumbers.join(", "):"");
  cardSection.appendChild(pattern);
  if(Array.isArray(claim.cardValues)&&claim.cardValues.length===25){
   const grid=d.createElement("div");grid.className="claim-card";
   ["B","I","N","G","O"].forEach(letter=>{const cell=d.createElement("div");cell.className="claim-cell claim-head";cell.textContent=letter;grid.appendChild(cell);});
   const calledSet=new Set((claim.calledNumbers||[]).map(Number));
   claim.cardValues.forEach(value=>{
    const cell=d.createElement("div");
    cell.className="claim-cell"+(value==="FREE"?" free":calledSet.has(Number(value))?" hit":"");
    cell.textContent=String(value);grid.appendChild(cell);
   });
   cardSection.appendChild(grid);
  }else{
   const note=d.createElement("div");note.className="claim-note";note.textContent="Card values were not included in this claim.";cardSection.appendChild(note);
  }
  body.appendChild(cardSection);
 });
 const valid=rendered.filter(item=>item.verdict==="winner"&&String(item.claim.status||"").toLowerCase()==="pending");
 const groups=new Map();
 valid.forEach(item=>{
  const c=item.claim,key=String(Number(c.gameRound)||0)+"|"+String(c.pattern||"")+"|"+JSON.stringify(c.calledNumbers||[]);
  if(!groups.has(key))groups.set(key,[]);
  groups.get(key).push(c);
 });
 for(const group of groups.values()){
  const players=[...new Set(group.map(c=>c.playerId))];
  const pool=(Number(room.roundSalesTotal)||0)*0.8;
  const share=players.length?pool/players.length:0;
  const note=d.createElement("div");note.className="claim-note";note.style.cssText="margin:8px 0;font-weight:bold";
  note.textContent="Valid claim group • "+players.length+" distinct winner(s) • 80% prize pool: "+pool.toFixed(2)+" ETB • Each: "+share.toFixed(2)+" ETB";
  body.appendChild(note);
  const confirm=d.createElement("button");confirm.type="button";
  confirm.textContent="Confirm all "+group.length+" valid claim(s) • Pay "+share.toFixed(2)+" ETB each • Start next round";
  confirm.dataset.confirmGroup=group[0].claimId;confirm.disabled=pool<=0;
  confirm.style.cssText="display:block;margin:8px 0 14px;padding:10px 12px;background:#16865d;color:white;border:0;border-radius:6px;font-weight:bold";
  body.appendChild(confirm);
 }
}
function showClaimInAdminPage(m){
 if(!m||!latestRoomState)return;
 if(!latestRoomState.claims)latestRoomState.claims={};
 latestRoomState.claims[m.claimId]=m;
 renderWinnerClaims(latestRoomState);
}
document.getElementById("adminFrame").addEventListener("load",()=>{adminFrameReady=true;installPage2Panel();if(latestRoomState)renderWinnerClaims(latestRoomState);sync();});
function sync(){
 if(!socket||socket.readyState!==WebSocket.OPEN)return;
 try{
  const raw=localStorage.getItem("eliasBingoAdminV3");
  if(!raw)return;
  const state=JSON.parse(raw),nums=Array.isArray(state.called)?state.called:[];
  const patternName=PATTERN_NAMES[state.pattern]||state.pattern||"Not selected";
  const payload=JSON.stringify({calledNumbers:nums,pattern:state.pattern||"",patternName,patternMode:state.patternMode||"auto"});
  if(payload===lastSent)return;
  lastSent=payload;
  socket.send(JSON.stringify({type:"ADMIN_SYNC_STATE",calledNumbers:nums,pattern:state.pattern||"",patternName,patternMode:state.patternMode||"auto"}));
  if(adminFrameReady){installPage2Panel();}
  status.textContent="Live • "+input.value+" • "+nums.length+" numbers called";
 }catch(e){status.textContent="Could not read Admin game state."}
}
document.getElementById("resetRound").addEventListener("click",()=>{
 if(!socket||socket.readyState!==WebSocket.OPEN){status.textContent="Connect Admin first.";return;}
 if(!confirm("Reset this game round? All cards will become available to every player. Wallets and transaction history will stay safe."))return;
 try{
  const raw=localStorage.getItem("eliasBingoAdminV3");
  if(raw){const state=JSON.parse(raw);state.called=[];localStorage.setItem("eliasBingoAdminV3",JSON.stringify(state));}
 }catch(e){status.textContent="Could not reset Admin game state.";return;}
 lastSent="";
 socket.send(JSON.stringify({type:"ADMIN_START_NEW_ROUND"}));
 status.textContent="Resetting game and releasing all cards…";
 setTimeout(()=>{const frame=document.getElementById("adminFrame");frame.src=frame.src;},250);
});
document.getElementById("newRoom").addEventListener("click",createRoom);
document.getElementById("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(input.value);status.textContent="Game ID copied: "+input.value}catch{status.textContent="Game ID: "+input.value}});
setInterval(sync,700);
window.addEventListener("storage",sync);
</script><script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/service-worker.js").catch(() => {}));
}
let eliasInstallPrompt = null;
window.addEventListener("beforeinstallprompt", event => {
  event.preventDefault();
  eliasInstallPrompt = event;
  if (!document.getElementById("eliasInstallButton")) {
    const button = document.createElement("button");
    button.id = "eliasInstallButton";
    button.type = "button";
    button.textContent = "Install ELIAS BINGO";
    button.style.cssText = "position:fixed;right:14px;bottom:14px;z-index:99999;padding:12px 16px;border:0;border-radius:999px;background:#f4c542;color:#17243a;font-weight:700;box-shadow:0 3px 14px #0005";
    button.addEventListener("click", async () => {
      if (!eliasInstallPrompt) return;
      eliasInstallPrompt.prompt();
      await eliasInstallPrompt.userChoice;
      eliasInstallPrompt = null;
      button.remove();
    });
    document.body.appendChild(button);
  }
});
window.addEventListener("appinstalled", () => {
  eliasInstallPrompt = null;
  document.getElementById("eliasInstallButton")?.remove();
});
</script>
