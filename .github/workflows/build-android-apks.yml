name: Build ELIAS BINGO Android APKs

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apks.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.role }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [owner, admin, player]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android
        run: gradle assemble${{ matrix.role == 'owner' && 'Owner' || matrix.role == 'admin' && 'Admin' || 'Player' }}Debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elias-bingo-${{ matrix.role }}-apk
          path: android/app/build/outputs/apk/${{ matrix.role }}/debug/*.apk
          if-no-files-found: error
          retention-days: 30
