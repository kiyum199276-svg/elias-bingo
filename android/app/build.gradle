plugins {
    id 'com.android.application'
}

android {
    namespace 'com.eliasbingo.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.eliasbingo.mobile'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    flavorDimensions += 'role'
    productFlavors {
        owner {
            dimension 'role'
            applicationIdSuffix '.owner'
            resValue 'string', 'app_name', 'ELIAS BINGO OWNER'
            buildConfigField 'String', 'START_URL', '"https://elias-bingo.pages.dev/owner.html"'
        }
        admin {
            dimension 'role'
            applicationIdSuffix '.admin'
            resValue 'string', 'app_name', 'ELIAS BINGO ADMIN'
            buildConfigField 'String', 'START_URL', '"https://elias-bingo.pages.dev/admin-live.html"'
        }
        player {
            dimension 'role'
            applicationIdSuffix '.player'
            resValue 'string', 'app_name', 'ELIAS BINGO PLAYER'
            buildConfigField 'String', 'START_URL', '"https://elias-bingo.pages.dev/register.html"'
        }
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
